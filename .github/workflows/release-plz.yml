name: Release-plz

# SETUP REQUIRED (one-time, per repo):
#
# 1. GitHub Actions PR permission:
#    release-plz-pr opens Release PRs via the GitHub API. By default, GitHub
#    Actions cannot create PRs. Enable once:
#      GitHub repo -> Settings -> Actions -> General -> Workflow permissions
#      -> enable "Allow GitHub Actions to create and approve pull requests"
#    Without this, release-plz-pr fails with HTTP 403.
#
# 2. CARGO_REGISTRY_TOKEN secret:
#    Required for release-plz-release to publish to crates.io.
#    Create at crates.io -> Account Settings -> API Tokens, then add as:
#      GitHub repo -> Settings -> Secrets and variables -> Actions
#      -> New repository secret: CARGO_REGISTRY_TOKEN
#    Without this, the release job fails with "please provide a non-empty token".
#
# 3. RELEASE_PLZ_TOKEN secret (PAT):
#    release-plz-release pushes git tags. Tags pushed with GITHUB_TOKEN do NOT
#    trigger other workflows (GitHub anti-loop policy). This means cargo-dist's
#    release.yml never fires and no binaries are built.
#    Fix: create a fine-grained PAT with Contents: Read+Write for this repo,
#    add it as secret RELEASE_PLZ_TOKEN, and use it in release-plz-release
#    (see the env block below). Tags pushed via PAT are attributed to the human
#    owner and DO trigger release.yml.
#
# INPUT NAME: the action input is `manifest_path` (underscore), NOT
# `manifest-path` (hyphen). Using the wrong name silently falls back to
# auto-discovery and can pick the wrong Cargo.toml in a workspace.
#
# fetch-depth: 0 is required. release-plz reads the full git history to
# determine which commits landed since the last tag. Shallow clones
# (fetch-depth: 1, the checkout default) cause it to miss commits.

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - master

jobs:
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: release-plz/action@v0.5
        with:
          command: release
          manifest_path: Cargo.toml
        env:
          # Use PAT so the tag push triggers release.yml (cargo-dist).
          # GITHUB_TOKEN tag pushes are blocked from triggering workflows.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
