[[package]]
name = "fren-cli"
semver_check = false

[workspace]
# cargo-dist owns the GitHub Release; release-plz handles versioning + crates.io only
git_release_enable = false
git_tag_enable = true
changelog_update = true
# semver_check requires a previously published version on crates.io for comparison.
# Enable once fren 0.2.0 is published.
semver_check = false
publish = true
# Stay in 0.x: breaking changes bump 0.X.0, never auto-promote to 1.0.0
publish_allow_dirty = false
# release_always: open a Release PR even when release-plz cannot find a previous
# published version on crates.io to compare against (first-release bootstrap).
# Remove after fren 0.2.0 is published.
release_always = true
