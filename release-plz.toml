[[package]]
name = "fren"
publish = false

[[package]]
name = "fren-cli"
publish = false
semver_check = false

[[package]]
name = "slug-preserve"
publish = false

[workspace]
# cargo-dist owns the GitHub Release; release-plz handles versioning + crates.io only
git_release_enable = false
git_tag_enable = true
changelog_update = true
# semver_check requires a previously published version on crates.io for comparison.
# Enable once fren 0.2.0 is published.
semver_check = false
# publish = false during bootstrap: release-plz tries to download the current version
# from crates.io to compare file lists, which fails when the package was never published.
# Re-enable after fren 0.2.0 is manually published with `cargo publish`.
publish = false
# Stay in 0.x: breaking changes bump 0.X.0, never auto-promote to 1.0.0
publish_allow_dirty = false
